name: iOS build check

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios-build-check.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-build-check.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile and run tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if v["name"].startswith("iPhone")))')
          xcodebuild \
            -project ScrollParty.xcodeproj \
            -scheme ScrollParty \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -resultBundlePath build/TestResults.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            -quiet \
            test

      - name: Print test summary
        if: always()
        run: |
          if [[ -d build/TestResults.xcresult ]]; then
            xcrun xcresulttool get test-results summary --path build/TestResults.xcresult --format json
          fi

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
