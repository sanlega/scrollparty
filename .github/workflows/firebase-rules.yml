name: Firestore rules

on:
  push:
    branches: [main]
    paths: ['firebase/**', '.github/workflows/firebase-rules.yml']
  pull_request:
    paths: ['firebase/**', '.github/workflows/firebase-rules.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - run: npm ci
      - run: npm test
